name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: true
      APP_USERNAME: ${{ secrets.APP_USERNAME }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Generate clean data
        run: npm run data:generate

      - name: Seed target database
        run: npm run seed

      - name: Unit tests
        run: npm test

      # CI has no Salesforce login, so it compares against a committed export of the org.
      - name: Compare Salesforce export with target
        run: npm run compare -- --source data/sf-export-fixture --known docs/known-defects.json

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload compare report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: compare-report
          path: reports/
          if-no-files-found: ignore
